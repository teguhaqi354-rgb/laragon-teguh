<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Data Diri</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 400px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 8px;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input[type="text"],
        input[type="date"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        .hobi label {
            margin-top: 8px;
        }

        button {
            margin-top: 20px;
            padding: 10px;
            width: 100%;
            background-color: #2878d0;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Form Data Diri</h2>

        <form action="proses_data_diri.php" method="POST">

            <label>Nama Lengkap</label>
            <input type="text" name="nama" required>

            <label>Tanggal Lahir</label>
            <input type="date" name="tanggal_lahir" required>

            <label>Hobi</label>

            <div class="hobi">
                <label>
                    <input type="checkbox" name="hobi[]" value="Membaca">
                    Membaca
                </label>

                <label>
                    <input type="checkbox" name="hobi[]" value="Olahraga">
                    Olahraga
                </label>

                <label>
                    <input type="checkbox" name="hobi[]" value="Musik">
                    Musik
                </label>

                <label>
                    <input type="checkbox" name="hobi[]" value="Lainnya">
                    Lainnya
                </label>
            </div>

            <button type="submit">Kirim</button>

        </form>
    </div>

</body>
</html>
